# ChangePilot Alembic configuration.
#
# Keep this file ASCII-only: Alembic reads alembic.ini with the locale encoding
# (configparser encoding="locale"), which is GBK/cp936 on a Chinese Windows
# system. Non-ASCII characters here break every alembic command.
#
# No connection details are stored here. alembic/env.py builds the database URL
# from app.db.postgres.session.build_database_url(), which reuses the .env
# settings, so user / password / host / port / database never appear below.

[alembic]
# %(here)s keeps the migration directory resolvable when alembic is invoked
# from another working directory with -c.
script_location = %(here)s/alembic
prepend_sys_path = .
# Without this, Alembic splits path options on spaces, commas and colons, which
# breaks absolute Windows paths such as D:\ChangePilot. "os" uses os.pathsep.
path_separator = os

# sqlalchemy.url is supplied at runtime by alembic/env.py, hence commented out.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
