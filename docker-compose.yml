# ChangePilot 数据库容器基础设施
#
# 设计依据：
#   docs/changepilot_database_design_v0.4.md（PostgreSQL 18 / Neo4j 2026.x Community Edition）
#   docs/changepilot_business_domain_bom_model_v0.3.md（Neo4j 图结构 / PostgreSQL 事务数据分工）
#
# 凭据与端口全部来自项目根目录 .env（模板见 .env.example），本文件不写入任何密码。
name: changepilot

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 未在 .env 中设置}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 未在 .env 中设置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未在 .env 中设置}
    ports:
      # 容器内固定 5432，宿主机端口由 .env 的 POSTGRES_PORT 决定（本地为 5433）
      - "${POSTGRES_PORT:?POSTGRES_PORT 未在 .env 中设置}:5432"
    volumes:
      # PostgreSQL 18 起官方镜像的数据目录位于 /var/lib/postgresql/<major>/docker，
      # 对应的 VOLUME 已改为 /var/lib/postgresql，挂载旧路径 /var/lib/postgresql/data 会导致数据不持久化。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    # Community Edition 标签不带后缀（Enterprise Edition 才使用 -enterprise 后缀）
    # MVP 只能使用唯一约束与普通范围索引，不使用 Enterprise-only 约束
    image: neo4j:2026.08.1
    restart: unless-stopped
    environment:
      # 格式为 user/password，由 Neo4j 官方镜像入口脚本解析；
      # 初始用户名固定为 neo4j，传入其他用户名会导致容器启动失败（Invalid admin username）。
      # 密码仍从 .env 读取，本文件不写入密码。
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 未在 .env 中设置}
      # .env 中的 NEO4J_USER=neo4j 保留，供后续 Python 应用连接数据库使用
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # HTTP 服务就绪即视为数据库可用；后续脚本连接 Bolt 时仍需自行重试
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
    name: changepilot_postgres_data
  neo4j_data:
    name: changepilot_neo4j_data
  neo4j_logs:
    name: changepilot_neo4j_logs
